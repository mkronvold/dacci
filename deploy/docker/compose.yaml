services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    user: "${DACCI_HOST_UID:-0}:${DACCI_HOST_GID:-0}"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_ROOT: ${DACCI_RUNTIME_DATA_ROOT:-}
      GIT_SYNC_REPO_ROOT: ${DACCI_RUNTIME_GIT_SYNC_REPO_ROOT:-}
      GIT_SYNC_REMOTE_URL: ${GIT_SYNC_REMOTE_URL:-}
      DACCI_LIBRARY_ROOTS: ${DACCI_LIBRARY_ROOTS:-/workspace}
      HOME: ${DACCI_RUNTIME_HOME:-/tmp/dacci-home}
      DACCI_RUNTIME_SSH_STAGE_DIR: ${DACCI_RUNTIME_SSH_STAGE_DIR:-/var/run/dacci-host-ssh-stage}
      DACCI_RUNTIME_SSH_SOURCE_DIR: ${DACCI_RUNTIME_SSH_SOURCE_DIR:-/var/run/dacci-host-ssh-live}
      SSH_AUTH_SOCK: ${DACCI_SSH_AUTH_SOCK:-}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${DACCI_LIBRARY_WORKSPACE_ROOT:-../../workspace}
        target: /workspace
      - type: bind
        source: ${DACCI_CONTENT_ROOT:-../../workspace/.dacci-empty-content}/data
        target: /workspace/${DACCI_CONTENT_REPO_NAME:-.dacci-empty-content}/data
      - type: bind
        source: ${DACCI_HOST_SSH_STAGE_DIR:-./git-ssh}
        target: ${DACCI_RUNTIME_SSH_STAGE_DIR:-/var/run/dacci-host-ssh-stage}
        read_only: true
      - type: bind
        source: ${DACCI_HOST_SSH_SOURCE_DIR:-./git-ssh}
        target: ${DACCI_RUNTIME_SSH_SOURCE_DIR:-/var/run/dacci-host-ssh-live}
        read_only: true
      - type: bind
        source: ${DACCI_SSH_AUTH_SOCK_DIR:-/tmp/dacci-empty-ssh-agent}
        target: ${DACCI_SSH_AUTH_SOCK_DIR:-/tmp/dacci-empty-ssh-agent}
        read_only: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ready').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    user: "${DACCI_HOST_UID:-0}:${DACCI_HOST_GID:-0}"
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      HOME: ${DACCI_RUNTIME_HOME:-/tmp/dacci-home}
      WEB_API_BASE_URL: http://127.0.0.1:3000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:4173:4173"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4173/ready').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
