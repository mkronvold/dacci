apiVersion: apps/v1
kind: Deployment
metadata:
  name: dacci-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dacci-api
  template:
    metadata:
      labels:
        app: dacci-api
    spec:
      securityContext:
        fsGroup: 1000
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: dacci-api:seed
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: dacci-api-runtime
          env:
            - name: GIT_SSH_COMMAND
              value: ssh -i /var/run/dacci-git/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=/var/run/dacci-git/known_hosts
          ports:
            - containerPort: 3000
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            # The API image contains the app code; /workspace holds the content repo checkout only.
            - name: workspace
              mountPath: /workspace
            - name: git-ssh
              mountPath: /var/run/dacci-git
              readOnly: true
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: dacci-workspace
        - name: git-ssh
          secret:
            secretName: dacci-git-ssh
            optional: true
            defaultMode: 288
            items:
              - key: id_ed25519
                path: id_ed25519
              - key: known_hosts
                path: known_hosts
