apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dacci
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dacci.example.com
      secretName: dacci-tls
  rules:
    - host: dacci.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: dacci-api
                port:
                  name: http
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: dacci-api
                port:
                  name: http
          - path: /ready
            pathType: Prefix
            backend:
              service:
                name: dacci-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dacci-web
                port:
                  name: http
