apiVersion: apps/v1
kind: Deployment
metadata:
  name: dacci-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dacci-web
  template:
    metadata:
      labels:
        app: dacci-web
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: dacci-web:seed
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: dacci-web-runtime
          ports:
            - containerPort: 4173
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
